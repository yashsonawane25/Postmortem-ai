---
# This is applied as a Kubernetes Secret consumed by kube-prometheus-stack.
# kubectl create secret generic alertmanager-kube-prometheus-stack-alertmanager \
#   --from-file=alertmanager.yaml \
#   -n monitoring --dry-run=client -o yaml | kubectl apply -f -
#
# OR patch it via Helm values (see setup.sh).

global:
  resolve_timeout: 5m
  # SMTP / Slack / PD credentials can go here for real alerting

route:
  group_by: ["alertname", "namespace", "pod"]
  group_wait: 10s       # wait 10s before sending first notification
  group_interval: 30s   # how long to wait before sending a notification about new alerts
  repeat_interval: 1h   # resend if still firing
  receiver: "postmortem-ai-webhook"

  routes:
    # Critical alerts get their own route with no repeat delay
    - match:
        severity: critical
      receiver: "postmortem-ai-webhook"
      repeat_interval: 15m

    - match:
        severity: warning
      receiver: "postmortem-ai-webhook"
      repeat_interval: 30m

receivers:
  - name: "postmortem-ai-webhook"
    webhook_configs:
      - url: "http://postmortem-ai-service.default.svc.cluster.local:8000/alert"
        send_resolved: true
        http_config:
          # If your service requires auth, add bearer_token or basic_auth here
          follow_redirects: true
        # Pass all alert labels in the webhook body
        max_alerts: 10

inhibit_rules:
  # Suppress warning if critical already firing for the same pod
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "namespace", "pod"]
