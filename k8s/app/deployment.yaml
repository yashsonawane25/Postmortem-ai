---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-broken-app
  namespace: default
  labels:
    app: demo-broken-app
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-broken-app
  template:
    metadata:
      labels:
        app: demo-broken-app
      annotations:
        # Prometheus scrape annotations (for kube-prometheus-stack)
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/health"
    spec:
      containers:
        - name: demo-broken-app
          image: demo-broken-app:latest
          imagePullPolicy: Never   # use local kind image
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: STRESS_CPU
              value: "false"   # set to "true" to auto-burn CPU on start
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"      # alert fires when this is sustained near-limit
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-broken-app
  namespace: default
  labels:
    app: demo-broken-app
spec:
  selector:
    app: demo-broken-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
